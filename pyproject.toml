[project]
name = "blank-app-template"
version = "0.1.0"
description = "Trade idea scanner with tight ATR-capped stop losses."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.61.1",
    "yfinance>=0.2.54",
    "pandas>=2.2",
    "plotly>=5.24",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
